<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - Meridian Intelligence</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .contact-container {
            max-width: 800px;
            margin: 120px auto;
            padding: 40px;
            background: rgba(0, 38, 82, 0.4);
            border: 2px solid rgba(0, 217, 255, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .contact-container h1 {
            color: var(--cyan-bright);
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .contact-container p {
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--cyan-bright);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 26, 51, 0.6);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            color: var(--white);
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--cyan-bright);
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--cyan-bright) 0%, var(--cyan-light) 100%);
            color: var(--primary-navy);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
        }

        .success-message {
            display: none;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .contact-container {
                margin: 80px 20px;
                padding: 30px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .contact-container h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">◆</span>
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <span>Meridian Intelligence</span>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#hero" class="nav-link">Home</a></li>
                <li><a href="index.html#agents" class="nav-link">Agents</a></li>
                <li><a href="index.html#services" class="nav-link">Services</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="#contact" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="contact-container">
        <h1>Let's Get Started</h1>
        <p>Tell us about your business and how we can help you incorporate AI into your operations.</p>

        <div class="success-message" id="successMessage">
            ✓ Thank you! Your information has been saved. We'll be in touch soon!
        </div>

        <form id="contactForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="company">Company *</label>
                    <input type="text" id="company" name="company" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="country">Country *</label>
                    <input type="text" id="country" name="country" required>
                </div>
                <div class="form-group">
                    <label for="city">City *</label>
                    <input type="text" id="city" name="city" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="industry">Industry *</label>
                    <input type="text" id="industry" name="industry" placeholder="e.g., Technology, Retail, Healthcare" required>
                </div>
                <div class="form-group">
                    <label for="queryType">Type of Query *</label>
                    <select id="queryType" name="queryType" required>
                        <option value="">Select...</option>
                        <option value="AI Implementation">AI Implementation for My Business</option>
                        <option value="AI Training">AI Training Programs</option>
                        <option value="Consultancy">Consultancy & Analysis</option>
                        <option value="Demo">Portfolio Demo</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Message *</label>
                <textarea id="message" name="message" placeholder="Tell us more about your needs and how we can help..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <script src="database.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                company: document.getElementById('company').value,
                country: document.getElementById('country').value,
                city: document.getElementById('city').value,
                industry: document.getElementById('industry').value,
                queryType: document.getElementById('queryType').value,
                message: document.getElementById('message').value,
                timestamp: new Date().toISOString()
            };

            await saveToDatabase('leads', Date.now().toString(), formData);

            // Show success message
            document.getElementById('successMessage').classList.add('show');

            // Reset form
            this.reset();

            // Hide success message after 5 seconds
            setTimeout(() => {
                document.getElementById('successMessage').classList.remove('show');
            }, 5000);
        });
    </script>
</body>
</html>
