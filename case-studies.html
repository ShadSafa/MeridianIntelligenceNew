<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Studies - Meridian Intelligence</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .case-studies-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 40px;
        }

        .case-studies-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .case-studies-header h1 {
            color: var(--cyan-bright);
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .case-studies-header p {
            color: var(--text-light);
            font-size: 1.2rem;
        }

        .case-studies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .case-study-card {
            background: rgba(0, 38, 82, 0.4);
            border: 2px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .case-study-card:hover {
            border-color: rgba(0, 217, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.2);
            transform: translateY(-5px);
        }

        .case-study-card h3 {
            color: var(--cyan-bright);
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .case-study-tag {
            display: inline-block;
            background: rgba(0, 217, 255, 0.2);
            color: var(--cyan-bright);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .case-study-card p {
            color: var(--text-light);
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .case-study-results {
            background: rgba(0, 217, 255, 0.1);
            border-left: 3px solid var(--cyan-bright);
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .case-study-results h4 {
            color: var(--cyan-bright);
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .case-study-results ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .case-study-results li {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 5px;
            padding-left: 20px;
            position: relative;
        }

        .case-study-results li:before {
            content: '\2713';
            position: absolute;
            left: 0;
            color: #00ff88;
        }

        .add-case-study-btn {
            background: linear-gradient(135deg, var(--cyan-bright) 0%, var(--cyan-light) 100%);
            color: var(--primary-navy);
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            margin-top: 30px;
            transition: all 0.3s ease;
        }

        .add-case-study-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--primary-navy);
            border: 2px solid rgba(0, 217, 255, 0.3);
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: var(--cyan-bright);
            margin-bottom: 20px;
        }

        .modal-content .form-group {
            margin-bottom: 15px;
        }

        .modal-content label {
            display: block;
            color: var(--cyan-bright);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0, 38, 82, 0.6);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            color: var(--white);
            font-family: inherit;
            box-sizing: border-box;
        }

        .modal-content textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .modal-buttons .save-btn {
            background: var(--cyan-bright);
            color: var(--primary-navy);
        }

        .modal-buttons .cancel-btn {
            background: rgba(0, 217, 255, 0.2);
            color: var(--cyan-bright);
            border: 1px solid var(--cyan-bright);
        }

        .status-line {
            color: var(--text-light);
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .case-studies-container {
                padding: 80px 20px;
            }

            .case-studies-header h1 {
                font-size: 2rem;
            }

            .case-studies-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">&#9670;</span>
                <a href="index.html"><span>Meridian Intelligence</span></a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#hero" class="nav-link">Home</a></li>
                <li><a href="index.html#agents" class="nav-link">Agents</a></li>
                <li><a href="index.html#services" class="nav-link">Services</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><button type="button" id="authButton" class="auth-button">Admin sign in</button></li>
            </ul>
        </div>
    </nav>

    <div class="case-studies-container">
        <div class="case-studies-header">
            <h1>Case Studies</h1>
            <p>See how we've helped businesses transform with AI</p>
        </div>

        <div class="form-notice" id="pageNotice"></div>

        <div class="case-studies-grid" id="caseStudiesGrid"></div>
        <p class="status-line" id="statusLine">Loading case studies...</p>

        <button type="button" class="add-case-study-btn" id="openAddModal" data-requires-auth>
            + Add Case Study
        </button>
        <p class="admin-hint">Sign in as an administrator to add a case study.</p>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>Add New Case Study</h2>
            <div class="form-notice" id="modalNotice"></div>
            <div class="form-group">
                <label for="csCompanyName">Company Name</label>
                <input type="text" id="csCompanyName" maxlength="120" placeholder="Company name">
            </div>
            <div class="form-group">
                <label for="csIndustry">Industry</label>
                <input type="text" id="csIndustry" maxlength="80" placeholder="e.g., Technology, Retail">
            </div>
            <div class="form-group">
                <label for="csChallenge">Challenge</label>
                <textarea id="csChallenge" maxlength="1000" placeholder="What was the main challenge?"></textarea>
            </div>
            <div class="form-group">
                <label for="csSolution">Solution</label>
                <textarea id="csSolution" maxlength="1000" placeholder="How did we help?"></textarea>
            </div>
            <div class="form-group">
                <label for="csResults">Results (one per line)</label>
                <textarea id="csResults" maxlength="3000" placeholder="One result per line"></textarea>
            </div>
            <div class="modal-buttons">
                <button type="button" class="save-btn" id="saveCaseStudy">Save</button>
                <button type="button" class="cancel-btn" id="cancelCaseStudy">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="auth.js"></script>
    <script src="page-case-studies.js"></script>
</body>
</html>
