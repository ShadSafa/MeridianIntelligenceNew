<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Studies - Meridian Intelligence</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .case-studies-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 40px;
        }

        .case-studies-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .case-studies-header h1 {
            color: var(--cyan-bright);
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .case-studies-header p {
            color: var(--text-light);
            font-size: 1.2rem;
        }

        .case-studies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .case-study-card {
            background: rgba(0, 38, 82, 0.4);
            border: 2px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .case-study-card:hover {
            border-color: rgba(0, 217, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.2);
            transform: translateY(-5px);
        }

        .case-study-card h3 {
            color: var(--cyan-bright);
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .case-study-tag {
            display: inline-block;
            background: rgba(0, 217, 255, 0.2);
            color: var(--cyan-bright);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .case-study-card p {
            color: var(--text-light);
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .case-study-results {
            background: rgba(0, 217, 255, 0.1);
            border-left: 3px solid var(--cyan-bright);
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .case-study-results h4 {
            color: var(--cyan-bright);
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .case-study-results ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .case-study-results li {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 5px;
            padding-left: 20px;
            position: relative;
        }

        .case-study-results li:before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #00ff88;
        }

        .add-case-study-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--cyan-bright) 0%, var(--cyan-light) 100%);
            color: var(--primary-navy);
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            margin-top: 30px;
            transition: all 0.3s ease;
        }

        .add-case-study-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--primary-navy);
            border: 2px solid rgba(0, 217, 255, 0.3);
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: var(--cyan-bright);
            margin-bottom: 20px;
        }

        .modal-content .form-group {
            margin-bottom: 15px;
        }

        .modal-content label {
            display: block;
            color: var(--cyan-bright);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0, 38, 82, 0.6);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            color: var(--white);
            font-family: inherit;
            box-sizing: border-box;
        }

        .modal-content textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .modal-buttons .save-btn {
            background: var(--cyan-bright);
            color: var(--primary-navy);
        }

        .modal-buttons .cancel-btn {
            background: rgba(0, 217, 255, 0.2);
            color: var(--cyan-bright);
            border: 1px solid var(--cyan-bright);
        }

        @media (max-width: 768px) {
            .case-studies-container {
                padding: 80px 20px;
            }

            .case-studies-header h1 {
                font-size: 2rem;
            }

            .case-studies-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">◆</span>
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <span>Meridian Intelligence</span>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#hero" class="nav-link">Home</a></li>
                <li><a href="index.html#agents" class="nav-link">Agents</a></li>
                <li><a href="index.html#services" class="nav-link">Services</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="case-studies-container">
        <div class="case-studies-header">
            <h1>Case Studies</h1>
            <p>See how we've helped businesses transform with AI</p>
        </div>

        <div class="case-studies-grid" id="caseStudiesGrid"></div>

        <button class="add-case-study-btn" onclick="openAddModal()">+ Add Case Study</button>
    </div>

    <!-- Add Case Study Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>Add New Case Study</h2>
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" id="csCompanyName" placeholder="Company name">
            </div>
            <div class="form-group">
                <label>Industry</label>
                <input type="text" id="csIndustry" placeholder="e.g., Technology, Retail, etc.">
            </div>
            <div class="form-group">
                <label>Challenge</label>
                <textarea id="csChallenge" placeholder="What was the main challenge?"></textarea>
            </div>
            <div class="form-group">
                <label>Solution</label>
                <textarea id="csSolution" placeholder="How did we help?"></textarea>
            </div>
            <div class="form-group">
                <label>Results (one per line)</label>
                <textarea id="csResults" placeholder="Line 1: Result 1&#10;Line 2: Result 2&#10;Line 3: Result 3"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="save-btn" onclick="saveNewCaseStudy()">Save</button>
                <button class="cancel-btn" onclick="closeAddModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script>
        const defaultCaseStudies = [
            {
                company: "TechFlow Solutions",
                industry: "IT Services",
                challenge: "Managing large volumes of customer inquiries and automating repetitive development tasks.",
                solution: "Implemented AI agents for customer support automation and code review assistance.",
                results: [
                    "60% reduction in support response time",
                    "40% increase in development efficiency",
                    "Customer satisfaction score improved to 92%"
                ]
            },
            {
                company: "DataVision Inc",
                industry: "IT Consulting",
                challenge: "Processing and analyzing massive datasets for client reports took weeks.",
                solution: "Deployed AI analytics agents to automate data processing and report generation.",
                results: [
                    "Report generation time reduced from 3 weeks to 3 days",
                    "85% improvement in data accuracy",
                    "Enabled delivery of more client projects annually"
                ]
            },
            {
                company: "RetailHub Marketplace",
                industry: "E-commerce & Retail",
                challenge: "Inventory management and personalized customer recommendations at scale.",
                solution: "Integrated AI agents for inventory optimization and personalized product recommendations.",
                results: [
                    "35% reduction in inventory holding costs",
                    "28% increase in average order value",
                    "Customer retention increased by 45%"
                ]
            },
            {
                company: "The Urban Bistro",
                industry: "Food & Hospitality",
                challenge: "Managing reservations, orders, and customer preferences manually.",
                solution: "Deployed AI agents for reservation management and personalized dining recommendations.",
                results: [
                    "50% faster booking response time",
                    "30% increase in repeat customers",
                    "Reduced staff workload by 25%"
                ]
            },
            {
                company: "Justice & Associates Law Firm",
                industry: "Legal Services",
                challenge: "Document review and case research consumed 40% of billable hours.",
                solution: "Implemented AI agents for document analysis and legal research automation.",
                results: [
                    "20% increase in billable hours per attorney",
                    "Document review time cut in half",
                    "Improved case preparation quality by 35%"
                ]
            }
        ];

        async function loadCaseStudies() {
            let caseStudies = await loadFromDatabase('caseStudies', 'data') || { studies: defaultCaseStudies };

            if (!caseStudies.studies || caseStudies.studies.length === 0) {
                caseStudies.studies = defaultCaseStudies;
                await saveToDatabase('caseStudies', 'data', caseStudies);
            }

            renderCaseStudies(caseStudies.studies);
        }

        function renderCaseStudies(studies) {
            const grid = document.getElementById('caseStudiesGrid');
            grid.innerHTML = '';

            studies.forEach((study, index) => {
                const card = document.createElement('div');
                card.className = 'case-study-card';
                card.innerHTML = `
                    <h3>${study.company}</h3>
                    <span class="case-study-tag">${study.industry}</span>
                    <p><strong>Challenge:</strong> ${study.challenge}</p>
                    <p><strong>Solution:</strong> ${study.solution}</p>
                    <div class="case-study-results">
                        <h4>Results</h4>
                        <ul>
                            ${study.results.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openAddModal() {
            document.getElementById('addModal').classList.add('show');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('show');
            document.getElementById('csCompanyName').value = '';
            document.getElementById('csIndustry').value = '';
            document.getElementById('csChallenge').value = '';
            document.getElementById('csSolution').value = '';
            document.getElementById('csResults').value = '';
        }

        async function saveNewCaseStudy() {
            const company = document.getElementById('csCompanyName').value;
            const industry = document.getElementById('csIndustry').value;
            const challenge = document.getElementById('csChallenge').value;
            const solution = document.getElementById('csSolution').value;
            const resultsText = document.getElementById('csResults').value;

            if (!company || !industry || !challenge || !solution || !resultsText) {
                alert('Please fill in all fields');
                return;
            }

            const newStudy = {
                company,
                industry,
                challenge,
                solution,
                results: resultsText.split('\n').filter(r => r.trim())
            };

            let caseStudies = await loadFromDatabase('caseStudies', 'data') || { studies: [] };
            caseStudies.studies.push(newStudy);
            await saveToDatabase('caseStudies', 'data', caseStudies);

            renderCaseStudies(caseStudies.studies);
            closeAddModal();
        }

        // Load case studies on page load
        loadCaseStudies();
    </script>
</body>
</html>
