<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQs - Meridian Intelligence</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .faqs-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 40px;
        }

        .faqs-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .faqs-header h1 {
            color: var(--cyan-bright);
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .faqs-header p {
            color: var(--text-light);
            font-size: 1.2rem;
        }

        .faq-item {
            background: rgba(0, 38, 82, 0.4);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .faq-question {
            width: 100%;
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: rgba(0, 26, 51, 0.6);
            border: none;
            border-bottom: 1px solid rgba(0, 217, 255, 0.1);
            font-family: inherit;
            text-align: left;
            transition: background 0.3s ease;
        }

        .faq-question:hover {
            background: rgba(0, 38, 82, 0.6);
        }

        .faq-question span:first-child {
            color: var(--cyan-bright);
            font-size: 1.1rem;
            font-weight: 600;
            flex: 1;
        }

        .faq-toggle {
            color: var(--cyan-bright);
            font-weight: bold;
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .faq-item.active .faq-toggle {
            transform: rotate(45deg);
        }

        .faq-answer {
            display: none;
            padding: 20px;
            color: var(--text-light);
            line-height: 1.8;
            background: rgba(0, 26, 51, 0.4);
        }

        .faq-item.active .faq-answer {
            display: block;
        }

        .add-faq-btn {
            background: linear-gradient(135deg, var(--cyan-bright) 0%, var(--cyan-light) 100%);
            color: var(--primary-navy);
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            margin-top: 40px;
            transition: all 0.3s ease;
        }

        .add-faq-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--primary-navy);
            border: 2px solid rgba(0, 217, 255, 0.3);
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: var(--cyan-bright);
            margin-bottom: 20px;
        }

        .modal-content .form-group {
            margin-bottom: 15px;
        }

        .modal-content label {
            display: block;
            color: var(--cyan-bright);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0, 38, 82, 0.6);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            color: var(--white);
            font-family: inherit;
            box-sizing: border-box;
        }

        .modal-content textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .modal-buttons .save-btn {
            background: var(--cyan-bright);
            color: var(--primary-navy);
        }

        .modal-buttons .cancel-btn {
            background: rgba(0, 217, 255, 0.2);
            color: var(--cyan-bright);
            border: 1px solid var(--cyan-bright);
        }

        .status-line {
            color: var(--text-light);
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .faqs-container {
                padding: 80px 20px;
            }

            .faqs-header h1 {
                font-size: 2rem;
            }

            .faq-question span:first-child {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body class="page-bg page-bg--faqs">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">&#9670;</span>
                <a href="index.html"><span>Meridian Intelligence</span></a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#hero" class="nav-link">Home</a></li>
                <li><a href="index.html#agents" class="nav-link">Agents</a></li>
                <li><a href="index.html#services" class="nav-link">Services</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><button type="button" id="authButton" class="auth-button">Admin sign in</button></li>
            </ul>
        </div>
    </nav>

    <div class="faqs-container">
        <div class="faqs-header">
            <h1>Frequently Asked Questions</h1>
            <p>Get answers to common questions about our AI solutions</p>
        </div>

        <div class="form-notice" id="pageNotice"></div>

        <div id="faqsList"></div>
        <p class="status-line" id="statusLine">Loading FAQs...</p>

        <button type="button" class="add-faq-btn" id="openAddModal" data-requires-auth>+ Add FAQ</button>
        <p class="admin-hint">Sign in as an administrator to add an FAQ.</p>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New FAQ</h2>
            <div class="form-notice" id="modalNotice"></div>
            <div class="form-group">
                <label for="faqQuestion">Question</label>
                <input type="text" id="faqQuestion" maxlength="300" placeholder="What is your question?">
            </div>
            <div class="form-group">
                <label for="faqAnswer">Answer</label>
                <textarea id="faqAnswer" maxlength="2000" placeholder="Provide a detailed answer..."></textarea>
            </div>
            <div class="modal-buttons">
                <button type="button" class="save-btn" id="saveFaq">Save</button>
                <button type="button" class="cancel-btn" id="cancelFaq">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="auth.js"></script>
    <script src="page-faqs.js"></script>
</body>
</html>
